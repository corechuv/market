<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<title>Returning from PayPal…</title>

<body>
    <p>You can close this tab.</p>
    <script>
        (function () {
            const q = new URLSearchParams(location.search);
            const paymentId = q.get("paymentId") || q.get("pid") || "";
            const msg = { type: "paypal-approved", paymentId, status: "approved" };
            try { const ch = new BroadcastChannel("pp-redirect"); ch.postMessage(msg); ch.close(); } catch { }
            try { window.opener && window.opener.postMessage(msg, location.origin); } catch { }
            window.close() || (location.href = "/");
        })();
    </script>
</body>

</html>
