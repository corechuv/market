<!doctype html>
<html lang="">
<head>
  <script>
    (function () {
      // читаем выбранный язык пользователя
      var lang = null;
      try {
        lang = localStorage.getItem('lang');
      } catch (e) { }

      // если ничего нет — пробуем язык браузера
      if (!lang && window.navigator && navigator.language) {
        lang = navigator.language.slice(0, 2); // "de-DE" -> "de"
      }

      // дефолт
      if (!['de', 'en', 'ru'].includes(lang)) {
        lang = 'de';
      }

      document.documentElement.setAttribute('lang', lang);
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/theme.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="/favicon-16.png" sizes="16x16">
  <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" sizes="180x180">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { }
    })();
  </script>
  <title>Dashedo </title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  </script>
</body>

</html>
